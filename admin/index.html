<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sivakasi Firecrackers - Admin Dashboard</title>
  <link rel="icon" type="image/png" href="images/tj.png">
  <link rel="stylesheet" href="css/admin.css">
  <!-- jsPDF & AutoTable for Professional PDF Invoice Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

  <div id="loginScreen" class="login-box">
    <h2>Sivakasi Firecrackers Admin</h2>
    <p style="font-size:0.85rem;color:#777">Sign in with your admin account created in Firebase Authentication.</p>
    <input type="email" id="emailInput" placeholder="Admin email" autocomplete="username">
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
    <button onclick="login()">Log In</button>
    <p id="loginError" class="error-text"></p>
  </div>

  <div id="appScreen" style="display:none">
    <header>
      <h1>Sivakasi <span class="gold">Firecrackers Admin</span></h1>
      <button class="secondary" onclick="logout()">Log out</button>
    </header>
    <main>
      <div class="admin-tabs">
        <button class="tab-btn active" id="tabOrders" onclick="switchTab('orders')">📦 Orders (MongoDB)</button>
        <button class="tab-btn" id="tabCategories" onclick="switchTab('categories')">📁 Categories</button>
        <button class="tab-btn" id="tabTypes" onclick="switchTab('types')">🏷️ Cracker Types</button>
        <button class="tab-btn" id="tabProducts" onclick="switchTab('products')">Products</button>
        <button class="tab-btn" id="tabEnquiries" onclick="switchTab('enquiries')">Enquiries</button>
        <button class="tab-btn" id="tabNewsletter" onclick="switchTab('newsletter')">Newsletter</button>
      </div>

      <!-- ═══ MONGODB ORDERS PANEL ═══ -->
      <div id="ordersPanel">
        <!-- KPI Analytics -->
        <div class="order-stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total Orders</div>
            <div class="stat-val" id="statTotalOrders">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Revenue</div>
            <div class="stat-val gold" id="statTotalRevenue">₹0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pending Orders</div>
            <div class="stat-val" style="color:#d97706" id="statPendingOrders">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Confirmed Orders</div>
            <div class="stat-val" style="color:#2563eb" id="statConfirmedOrders">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Delivered Orders</div>
            <div class="stat-val" style="color:#16a34a" id="statDeliveredOrders">0</div>
          </div>
        </div>

        <!-- Orders Toolbar -->
        <div class="toolbar">
          <input type="text" id="orderSearchInput" placeholder="Search by Order #, Customer Name, or Phone..." style="min-width:280px" oninput="filterOrders()">
          <select id="orderStatusFilter" onchange="filterOrders()">
            <option value="all">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="dispatched">Dispatched</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <button onclick="loadOrders()">&#8635; Refresh Orders</button>
          <button class="danger" onclick="deleteAllOrders()" style="margin-left:8px">Clear All Orders</button>
          <span id="orderCountLabel" style="margin-left:auto;font-size:0.85rem;color:#777"></span>
        </div>

        <!-- Orders List Container -->
        <div id="ordersList" class="orders-list"></div>
      </div>

      <!-- ═══ CATEGORIES MANAGEMENT PANEL ═══ -->
      <div id="categoriesPanel" style="display:none">
        <div class="toolbar">
          <input type="text" id="categorySearchInput" placeholder="Search categories by name or slug..." style="min-width:280px" oninput="renderCategories()">
          <button onclick="openCategoryModal()">+ Add Category</button>
          <button class="secondary" onclick="loadCategories()">&#8635; Refresh Categories</button>
          <span id="categoryCountLabel" style="margin-left:auto;font-size:0.85rem;color:#777"></span>
        </div>
        <div id="categoriesList" class="category-grid"></div>
      </div>

      <!-- ═══ CRACKER TYPES MANAGEMENT PANEL ═══ -->
      <div id="typesPanel" style="display:none">
        <div class="toolbar">
          <input type="text" id="typeSearchInput" placeholder="Search cracker types by name or slug..." style="min-width:260px" oninput="renderTypes()">
          <select id="typeCategoryFilter" onchange="renderTypes()">
            <option value="all">All Categories</option>
          </select>
          <button onclick="openTypeModal()">+ Add Cracker Type</button>
          <button class="secondary" onclick="loadTypes()">&#8635; Refresh Types</button>
          <span id="typeCountLabel" style="margin-left:auto;font-size:0.85rem;color:#777"></span>
        </div>
        <div id="typesList" class="type-grid"></div>
      </div>

      <div id="productsPanel" style="display:none">
        <div class="toolbar">
          <input type="text" id="searchInput" placeholder="Search crackers by name or code..." oninput="renderGrid()">
          <select id="materialFilterAdmin" onchange="renderGrid()">
            <option value="all">All Categories</option>
            <option value="sparklers">Sparklers</option>
            <option value="ground">Ground Crackers</option>
            <option value="aerial">Aerial Fireworks</option>
            <option value="sound">Sound Crackers & Bombs</option>
            <option value="giftboxes">Gift Boxes</option>
            <option value="kids">Kids Special</option>
          </select>
          <select id="typeFilterAdmin" onchange="renderGrid()">
            <option value="all">All Types</option>
            <option value="sparklers">Sparklers / Phuljhadi</option>
            <option value="flowerpots">Flower Pots / Anaar</option>
            <option value="chakkars">Ground Chakkars</option>
            <option value="rockets">Rockets</option>
            <option value="skyshots">Sky Shots</option>
            <option value="bombs">Atom Bombs</option>
            <option value="garlands">Garlands / Ladi</option>
            <option value="fountains">Fountains</option>
            <option value="giftbox">Gift Boxes</option>
            <option value="kids">Kids Novelties</option>
          </select>
          <button onclick="openForm()">+ Add Cracker</button>
          <button class="danger" onclick="deleteAllProducts()" style="margin-left:8px">Delete All Products</button>
          <span id="countLabel" style="margin-left:auto;font-size:0.85rem;color:#777"></span>
        </div>
        <div id="grid" class="grid"></div>
      </div>

      <div id="enquiriesPanel" style="display:none">
        <div class="toolbar">
          <select id="enquiryTypeFilter" onchange="renderEnquiries()">
            <option value="all">All Enquiries</option>
            <option value="product">Product Enquiries</option>
            <option value="contact">Contact Form</option>
            <option value="cart_order">Cart Orders</option>
          </select>
          <button class="danger" onclick="deleteAllEnquiries()" style="margin-left:8px">Clear All Enquiries</button>
          <span id="enquiryCount" style="margin-left:auto;font-size:0.85rem;color:#777"></span>
        </div>
        <div id="enquiryList" class="data-list"></div>
      </div>

      <div id="newsletterPanel" style="display:none">
        <div class="toolbar">
          <span id="newsletterCount" style="font-size:0.85rem;color:#777"></span>
        </div>
        <div id="newsletterList" class="data-list"></div>
      </div>
    </main>
  </div>

  <div id="formBackdrop" class="modal-backdrop" style="display:none">
    <div class="modal">
      <h2 id="formTitle">Add Cracker</h2>
      <form id="productForm" onsubmit="return saveProduct(event)">
        <input type="hidden" id="productId">
        <div class="field">
          <label>Cracker Code (unique, e.g. CRK-001, SK-101)</label>
          <input type="text" id="f_code" placeholder="e.g. CRK-001" required>
        </div>
        <div class="field">
          <label>Cracker Name</label>
          <input type="text" id="f_name" placeholder="e.g. 10cm Electric Sparklers, Flower Pots Special" required>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="f_material" required>
            <option value="sparklers">Sparklers</option>
            <option value="ground">Ground Crackers (Chakkars, Anaar)</option>
            <option value="aerial">Aerial Fireworks (Sky Shots, Rockets)</option>
            <option value="sound">Sound Crackers & Bombs</option>
            <option value="giftboxes">Gift Boxes & Combos</option>
            <option value="kids">Kids Special</option>
          </select>
        </div>
        <div class="field">
          <label>Cracker Type</label>
          <select id="f_type" required>
            <option value="sparklers">Sparklers / Phuljhadi</option>
            <option value="flowerpots">Flower Pots / Anaar</option>
            <option value="chakkars">Ground Chakkars / Wheels</option>
            <option value="rockets">Rockets</option>
            <option value="skyshots">Sky Shots / Aerial Repeaters</option>
            <option value="bombs">Atom Bombs / Sound Crackers</option>
            <option value="garlands">Garlands / Ladi</option>
            <option value="fountains">Fancy Fountains</option>
            <option value="giftbox">Gift Boxes & Hampers</option>
            <option value="kids">Kids Crackers & Caps</option>
          </select>
        </div>
        <div class="field">
          <label>Price (₹ per box/pack)</label>
          <input type="number" id="f_price" placeholder="e.g. 150" min="0" step="1">
        </div>
        <div class="field">
          <label>Pieces / Packing (optional)</label>
          <input type="text" id="f_pieces" placeholder="e.g. 1 Box (10 Pcs), 1 Packet">
        </div>
        <div class="field">
          <label>Badge (optional, e.g. Bestseller, Diwali Special, 50% Off)</label>
          <input type="text" id="f_badge" placeholder="e.g. Bestseller">
        </div>
        <div class="field">
          <label>Description & Visual Effects</label>
          <textarea id="f_description"
            placeholder="Describe spark colors, sound, duration, safety instructions..."></textarea>
        </div>
        <div class="field checkbox-field">
          <input type="checkbox" id="f_active" checked>
          <label for="f_active" style="margin:0">Visible on the public site</label>
        </div>
        <div class="field">
          <label>Cracker Image (JPG/PNG/WEBP, upload to replace)</label>
          <input type="file" id="f_image" accept="image/*" onchange="previewImage(event)">
          <img id="imgPreview">
          <div class="upload-progress" id="uploadProgress">
            <div class="upload-progress-bar" id="uploadProgressBar"></div>
          </div>
        </div>
        <p class="error-text" id="formError"></p>
        <div class="modal-actions">
          <button type="button" class="secondary" onclick="closeForm()">Cancel</button>
          <button type="submit" id="saveBtn">Save Cracker</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══ CATEGORY MODAL ═══ -->
  <div id="categoryModalBackdrop" class="modal-backdrop" style="display:none">
    <div class="modal">
      <h2 id="categoryModalTitle">Add Product Category</h2>
      <form id="categoryForm" onsubmit="return saveCategory(event)">
        <input type="hidden" id="categoryId">
        <div class="field">
          <label>Category Name *</label>
          <input type="text" id="cat_name" placeholder="e.g. Aerial Fireworks, Sparklers" required oninput="autoSlugCategory()">
        </div>
        <div class="field">
          <label>Category Slug (identifier) *</label>
          <input type="text" id="cat_slug" placeholder="e.g. aerial, sparklers" required>
        </div>
        <div class="field">
          <label>Description (optional)</label>
          <textarea id="cat_description" placeholder="Brief description of fireworks in this category..."></textarea>
        </div>
        <p class="error-text" id="categoryFormError"></p>
        <div class="modal-actions">
          <button type="button" class="secondary" onclick="closeCategoryModal()">Cancel</button>
          <button type="submit" id="saveCategoryBtn">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══ CRACKER TYPE MODAL ═══ -->
  <div id="typeModalBackdrop" class="modal-backdrop" style="display:none">
    <div class="modal">
      <h2 id="typeModalTitle">Add Cracker Type</h2>
      <form id="typeForm" onsubmit="return saveType(event)">
        <input type="hidden" id="typeId">
        <div class="field">
          <label>Cracker Type Name *</label>
          <input type="text" id="typ_name" placeholder="e.g. Flower Pots / Anaar, Sky Shots" required oninput="autoSlugType()">
        </div>
        <div class="field">
          <label>Type Slug *</label>
          <input type="text" id="typ_slug" placeholder="e.g. flowerpots, skyshots" required>
        </div>
        <div class="field">
          <label>Parent Category *</label>
          <select id="typ_category" required>
            <option value="">Select Category</option>
          </select>
        </div>
        <div class="field">
          <label>Description / Effect Details (optional)</label>
          <textarea id="typ_description" placeholder="Description of visual and sound effects..."></textarea>
        </div>
        <p class="error-text" id="typeFormError"></p>
        <div class="modal-actions">
          <button type="button" class="secondary" onclick="closeTypeModal()">Cancel</button>
          <button type="submit" id="saveTypeBtn">Save Cracker Type</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase (compat SDKs — no build step required) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <!-- Crypto JS for Cloudinary Signature -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <!-- App config (edit with your own project keys) -->
  <script src="js/firebase-config.js"></script>
  <script src="js/cloudinary-config.js"></script>

  <!-- App logic -->
  <script src="js/admin.js"></script>
</body>

</html>
